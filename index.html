function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

const selectedQuestions = shuffleArray(rawQuestions).slice(0, 30).map(item => {
    const originalAnswerText = item.options[item.answer];
    const shuffledOptions = shuffleArray(item.options);
    const newAnswerIndex = shuffledOptions.indexOf(originalAnswerText);
    return {
        q: item.q,
        options: shuffledOptions,
        answer: newAnswerIndex
    };
});

const container = document.getElementById('questions-container');
document.getElementById('q-counter').innerText = `${selectedQuestions.length}/30`;

selectedQuestions.forEach((qObj, index) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'q-card';
    
    let optionsHtml = '';
    qObj.options.forEach((opt, optIndex) => {
        optionsHtml += `
            <li class="option-item">
                <label class="option-label">
                    <input type="radio" name="question_${index}" value="${optIndex}" required>
                    ${opt}
                </label>
            </li>
        `;
    });

    qDiv.innerHTML = `
        <div class="q-text">${index + 1}. ${qObj.q}</div>
        <ul class="options">${optionsHtml}</ul>
    `;
    container.appendChild(qDiv);
});

let totalSeconds = 40 * 60;
const timerElement = document.getElementById('time-left');

const timerInterval = setInterval(() => {
    if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        finishQuiz();
    } else {
        totalSeconds--;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        timerElement.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
}, 1000);

document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearInterval(timerInterval);
    finishQuiz();
});

function finishQuiz() {
    let score = 0;
    const form = document.getElementById('quiz-form');
    const formData = new FormData(form);

    selectedQuestions.forEach((qObj, index) => {
        const userAnswer = formData.get(`question_${index}`);
        if (userAnswer !== null && parseInt(userAnswer) === qObj.answer) {
            score++;
        }
    });

    const usedSeconds = (40 * 60) - totalSeconds;
    const usedMinutes = Math.floor(usedSeconds / 60);
    const usedSecs = usedSeconds % 60;

    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('score-text').innerText = `${score} / 30`;
    document.getElementById('time-taken-text').innerText = `Sarflangan vaqt: ${usedMinutes} daqiqa ${usedSecs} soniya`;
}
</script>
